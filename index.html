<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fingerprint test</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #111111;
            --muted: #8a8a8a;
            --line: #dcdcdc;
            --error: #c0392b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141414;
                --fg: #f2f2f2;
                --muted: #8a8a8a;
                --line: #333333;
                --error: #ff6b5b;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .auth {
            width: 100%;
            max-width: 280px;
            padding: 0 16px;
        }

        .switch {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .switch button {
            background: none;
            border: 0;
            border-bottom: 2px solid transparent;
            padding: 0 0 6px;
            font: inherit;
            color: var(--muted);
            cursor: pointer;
        }

        .switch button[aria-selected="true"] {
            color: var(--fg);
            border-bottom-color: var(--fg);
        }

        .auth input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            font: inherit;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 6px;
            outline: none;
        }

        .auth input:focus {
            border-color: var(--fg);
        }

        .auth .enter {
            width: 100%;
            padding: 10px 12px;
            font: inherit;
            color: var(--bg);
            background: var(--fg);
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .auth .enter:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .auth .enter:focus-visible,
        .switch button:focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: 2px;
        }

        .message {
            min-height: 1.25em;
            margin: 12px 0 0;
            font-size: 14px;
            color: var(--muted);
        }

        .message.error {
            color: var(--error);
        }

        .greeting {
            font-size: 24px;
            margin: 0;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="auth" id="auth">
        <div class="switch" role="tablist">
            <button type="button" id="tab-login" role="tab" aria-selected="true">Login</button>
            <button type="button" id="tab-register" role="tab" aria-selected="false">Register</button>
        </div>

        <input id="username" type="text" placeholder="Username" autocomplete="username" autofocus>
        <button type="button" id="enter" class="enter">Enter</button>
        <p id="message" class="message" role="status"></p>
    </div>

    <p id="greeting" class="greeting" hidden></p>

    <script>
        // ---------- UI ----------
        let mode = "login";

        const tabs = {
            login: document.getElementById("tab-login"),
            register: document.getElementById("tab-register")
        };
        const usernameInput = document.getElementById("username");
        const enterBtn = document.getElementById("enter");
        const messageEl = document.getElementById("message");

        function setMode(next) {
            mode = next;
            for (const [name, el] of Object.entries(tabs)) {
                el.setAttribute("aria-selected", String(name === mode));
            }
            showMessage("");
        }

        function showMessage(text, isError = false) {
            messageEl.textContent = text;
            messageEl.classList.toggle("error", isError);
        }

        tabs.login.addEventListener("click", () => setMode("login"));
        tabs.register.addEventListener("click", () => setMode("register"));

        enterBtn.addEventListener("click", submit);
        usernameInput.addEventListener("keydown", e => {
            if (e.key === "Enter") submit();
        });

        // ---------- Auth ----------
        async function submit() {
            const username = usernameInput.value.trim();
            if (!username) {
                showMessage("Enter a username", true);
                return;
            }

            enterBtn.disabled = true;
            showMessage("");

            try {
                const { combined } = await collect();

                const response = await fetch("/" + mode, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, fingerprint: combined })
                });
                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.error || "Something went wrong", true);
                    return;
                }

                if (mode === "login") {
                    document.getElementById("auth").hidden = true;
                    const greeting = document.getElementById("greeting");
                    greeting.textContent = "Hi " + data.username;
                    greeting.hidden = false;
                } else {
                    setMode("login");
                    showMessage("Registered. You can log in now.");
                }
            } catch (err) {
                console.error(err);
                showMessage("Could not reach the server", true);
            } finally {
                enterBtn.disabled = false;
            }
        }

        // ---------- Fingerprinting code ----------

        // SHA-256 -> hex string (needs HTTPS or localhost)
        async function sha256(text) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
        }

        // Audio fingerprint: returns the raw sum (keep it, useful for fuzzy matching)
        async function audioFingerprint() {
            const ctx = new OfflineAudioContext(1, 44100, 44100);
            const osc = ctx.createOscillator();
            osc.type = "triangle";
            osc.frequency.value = 10000;

            const comp = ctx.createDynamicsCompressor();
            comp.threshold.value = -50;
            comp.knee.value = 40;
            comp.ratio.value = 12;
            comp.attack.value = 0;
            comp.release.value = 0.25;

            osc.connect(comp);
            comp.connect(ctx.destination);
            osc.start(0);

            const buffer = await ctx.startRendering();
            const samples = buffer.getChannelData(0).slice(4500, 5000);
            return samples.reduce((sum, v) => sum + Math.abs(v), 0);
        }

        async function collect() {
            // 1. Raw values
            const basic = {
                platform: navigator.platform,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory ?? null, // Chromium only
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                maxTouchPoints: navigator.maxTouchPoints
            };

            let audioRaw = null;
            try { audioRaw = await audioFingerprint(); } catch (e) { audioRaw = "error"; }

            const raw = { ...basic, audio: audioRaw };

            // 2. Hash each component separately (for similarity matching)
            const components = {};
            for (const [key, value] of Object.entries(raw)) {
                components[key] = await sha256(String(value));
            }

            // 3. One combined hash of everything
            const combined = await sha256(JSON.stringify(raw));

            return { raw, components, combined };
        }
    </script>
</body>

</html>
